wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 15min

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  includes:
    - src/childrensclock.h
  on_boot:
    priority: -100
    then:
      - light.addressable_set:
          id: led_matrix_light
          range_from: 0
          range_to: 255
          red: 0%
          green: 0%
          blue: 0%

      - light.turn_on:
          id: led_matrix_light
          brightness: 100%

      - component.update: led_matrix_display
logger:
  level: DEBUG
  baud_rate: 115200

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

globals:
  - id: display_initialized
    type: bool
    initial_value: 'false'
  - id: current_r
    type: float
    initial_value: '0.0'
  - id: current_g
    type: float
    initial_value: '0.0'
  - id: current_b
    type: float
    initial_value: '0.0'
  - id: anim_start_r
    type: float
    initial_value: '0.0'
  - id: anim_start_g
    type: float
    initial_value: '0.0'
  - id: anim_start_b
    type: float
    initial_value: '0.0'
  - id: anim_mode
    type: int
    initial_value: '0'
  - id: anim_to_state
    type: int
    initial_value: 'RED'
  - id: anim_start_time
    type: uint32_t
    initial_value: '0'
  - id: last_state
    type: int
    initial_value: '-1'
  - id: window_remaining_minutes
    type: float
    initial_value: '999.0'
  - id: wind_down_active
    type: bool
    initial_value: 'false'
  - id: wind_down_progress
    type: float
    initial_value: '0.0'
  - id: clock_progress
    type: float
    initial_value: '0.0'
  - id: schedule_valid
    type: bool
    initial_value: 'true'
  - id: last_frame_ms
    type: uint32_t
    initial_value: '0'

button:
  - platform: factory_reset
    disabled_by_default: true
    name: Restart with Factory Default Settings
  - platform: restart
    name: Restart
  - platform: safe_mode
    disabled_by_default: true
    name: Safe Mode Reboot
  - platform: template
    name: "Test Sunset Animation"
    icon: mdi:weather-sunset-down
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(anim_start_r) = id(current_r);
          id(anim_start_g) = id(current_g);
          id(anim_start_b) = id(current_b);
          id(anim_mode) = ANIM_SUNSET;
          id(anim_to_state) = RED;
          id(anim_start_time) = millis();
  - platform: template
    name: "Test Sunrise Animation"
    icon: mdi:weather-sunset-up
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(anim_start_r) = id(current_r);
          id(anim_start_g) = id(current_g);
          id(anim_start_b) = id(current_b);
          id(anim_mode) = ANIM_SUNRISE;
          id(anim_to_state) = AMBER;
          id(anim_start_time) = millis();
  - platform: template
    name: "Test Nap Start Animation"
    icon: mdi:weather-sunset-down
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(anim_start_r) = id(current_r);
          id(anim_start_g) = id(current_g);
          id(anim_start_b) = id(current_b);
          id(anim_mode) = ANIM_NAP_START;
          id(anim_to_state) = NAP;
          id(anim_start_time) = millis();
  - platform: template
    name: "Test Nap End Animation"
    icon: mdi:weather-sunset-up
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(anim_start_r) = id(current_r);
          id(anim_start_g) = id(current_g);
          id(anim_start_b) = id(current_b);
          id(anim_mode) = ANIM_NAP_END;
          id(anim_to_state) = GREEN;
          id(anim_start_time) = millis();
  - platform: template
    name: "Test Day Start Animation"
    icon: mdi:weather-sunny
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(anim_start_r) = id(current_r);
          id(anim_start_g) = id(current_g);
          id(anim_start_b) = id(current_b);
          id(anim_mode) = ANIM_DAY_START;
          id(anim_to_state) = GREEN;
          id(anim_start_time) = millis();

number:
  - platform: template
    name: "Brightness Day"
    id: day_brightness
    optimistic: true
    restore_value: true
    initial_value: 25
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:brightness-6

  - platform: template
    name: "Brightness Night"
    id: night_brightness
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:brightness-3
  - platform: template
    name: "Color Test Red"
    id: test_r
    entity_category: diagnostic
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 255
    step: 1
    icon: mdi:palette
  - platform: template
    name: "Color Test Green"
    id: test_g
    entity_category: diagnostic
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 255
    step: 1
    icon: mdi:palette
  - platform: template
    name: "Color Test Blue"
    id: test_b
    entity_category: diagnostic
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 255
    step: 1
    icon: mdi:palette

switch:
  - platform: template
    name: "Color Test Active"
    id: test_active
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    icon: mdi:test-tube
  - platform: template
    name: "Holiday Mode"
    id: holiday_mode
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:palm-tree
  - platform: template
    name: "Nap Enabled"
    id: nap_enabled
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:sleep

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Amsterdam"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
  # Backup source. Both platforms set the same system clock, so whichever
  # syncs first makes sntp_time valid; nothing else needs to change.
  - platform: homeassistant
    id: ha_time
    timezone: "Europe/Amsterdam"

font:
  - id: tinyfont
    file: "lexis.ttf"
    size: 8
    glyphs: " :0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"

datetime:
  - platform: template
    id: weekday_go
    type: time
    name: Schoolday Go
    optimistic: true
    initial_value: "07:00:00"
    restore_value: true
  - platform: template
    id: weekday_wake
    type: time
    name: Schoolday Wake up
    optimistic: true
    initial_value: "06:45:00"
    restore_value: true
  - platform: template
    id: weekday_bedtime
    type: time
    name: Schoolday Bedtime
    optimistic: true
    initial_value: "19:00:00"
    restore_value: true
  - platform: template
    id: weekend_go
    type: time
    name: Weekend Go
    optimistic: true
    initial_value: "07:15:00"
    restore_value: true
  - platform: template
    id: weekend_wake
    type: time
    name: Weekend Wake up
    optimistic: true
    initial_value: "07:00:00"
    restore_value: true
  - platform: template
    id: weekend_bedtime
    type: time
    name: Weekend Bedtime
    optimistic: true
    initial_value: "19:00:00"
    restore_value: true
  - platform: template
    id: nap_start
    type: time
    name: Nap Start
    optimistic: true
    initial_value: "12:30:00"
    restore_value: true
  - platform: template
    id: nap_end
    type: time
    name: Nap End
    optimistic: true
    initial_value: "15:00:00"
    restore_value: true

binary_sensor:
  - platform: template
    name: "Clock Schedule Valid"
    id: clock_schedule_valid
    entity_category: diagnostic
    lambda: return id(schedule_valid);

sensor:
  # Internal driver for the display; Home Assistant gets "Clock State" below.
  - name: Current state
    platform: template
    id: current_state
    internal: true
    update_interval: 1s
    lambda: |-
      auto now = GetBestTime(id(sntp_time), id(ha_time));
      if (!now.is_valid()) {
        if (id(clock_state_text).state != "No time") id(clock_state_text).publish_state("No time");
        return (float) RED;
      }

      Schedule s;
      s.weekdayWake = TimeAsMinutes(id(weekday_wake).hour, id(weekday_wake).minute);
      s.weekdayGo = TimeAsMinutes(id(weekday_go).hour, id(weekday_go).minute);
      s.weekdayBedtime = TimeAsMinutes(id(weekday_bedtime).hour, id(weekday_bedtime).minute);
      s.weekendWake = TimeAsMinutes(id(weekend_wake).hour, id(weekend_wake).minute);
      s.weekendGo = TimeAsMinutes(id(weekend_go).hour, id(weekend_go).minute);
      s.weekendBedtime = TimeAsMinutes(id(weekend_bedtime).hour, id(weekend_bedtime).minute);
      s.holiday = id(holiday_mode).state;
      s.napEnabled = id(nap_enabled).state;
      s.napStart = TimeAsMinutes(id(nap_start).hour, id(nap_start).minute);
      s.napEnd = TimeAsMinutes(id(nap_end).hour, id(nap_end).minute);

      ClockStatus st = EvaluateClock(s, now.day_of_week, now.hour, now.minute, now.second);
      bool was_valid = id(schedule_valid);
      id(schedule_valid) = st.scheduleValid;
      id(clock_progress) = st.progress;
      id(wind_down_active) = st.windDownActive;
      id(wind_down_progress) = st.windDownProgress;
      id(window_remaining_minutes) = st.remainingMinutes;

      const char *label = StateLabel(st);
      if (id(clock_state_text).state != label) id(clock_state_text).publish_state(label);

      int newState = st.state;
      // No animations while the schedule is (or just was) invalid, e.g.
      // while a parent is halfway through editing times.
      if (was_valid && st.scheduleValid && id(last_state) != -1 && id(last_state) != newState) {
        int newAnimMode = ANIM_NONE;
        if ((id(last_state) == GREEN || id(last_state) == AMBER) && newState == RED) newAnimMode = ANIM_SUNSET;
        else if (id(last_state) == RED && newState == AMBER) newAnimMode = ANIM_SUNRISE;
        else if (id(last_state) == GREEN && newState == NAP) newAnimMode = ANIM_NAP_START;
        else if (id(last_state) == NAP && newState == GREEN) newAnimMode = ANIM_NAP_END;
        else if (id(last_state) == AMBER && newState == GREEN) newAnimMode = ANIM_DAY_START;

        if (newAnimMode != ANIM_NONE) {
          id(anim_start_r) = id(current_r);
          id(anim_start_g) = id(current_g);
          id(anim_start_b) = id(current_b);
          id(anim_mode) = newAnimMode;
          id(anim_to_state) = newState;
          id(anim_start_time) = millis();
        }
      }

      id(last_state) = newState;
      return (float) newState;

  - platform: dht
    pin: GPIO4
    model: DHT22
    update_interval: 60s
    temperature:
      name: "Room Temperature"
      id: room_temperature
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      filters:
        - sliding_window_moving_average:
            window_size: 3
            send_every: 1
        - offset: ${temp_offset}
        - delta: 0.1
    humidity:
      name: "Room Humidity"
      id: room_humidity
      unit_of_measurement: "%"
      accuracy_decimals: 0
      filters:
        - sliding_window_moving_average:
            window_size: 3
            send_every: 1
        - offset: ${humidity_offset}
        - delta: 1.0

text_sensor:
  - platform: template
    name: "Clock State"
    id: clock_state_text
    icon: mdi:clock-outline
    # Published from the current_state sensor, only when the label changes:
    # Sleep, Waking up, Awake, Wind down, Nap, Invalid schedule, No time.
    update_interval: never

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    chipset: ws2812
    pin: GPIO13
    num_leds: 256
    id: led_matrix_light
    internal: true
    default_transition_length: 0s
    # Gamma is applied in childrensclock.h (LevelToRaw) so all channels scale
    # together. The light's own per-channel gamma shifts amber toward red.
    gamma_correct: 1.0
    restore_mode: ALWAYS_OFF

display:
  - platform: addressable_light
    id: led_matrix_display
    addressable_light_id: led_matrix_light
    width: 32
    height: 8
    rotation: 0°
    update_interval: 100ms
    pixel_mapper: |-
      if (x % 2 == 0) return (x * 8) + y;
      return (x * 8) + (7 - y);
    lambda: |-
      auto to_color = [](RGBColor c) { return Color((uint8_t) c.r, (uint8_t) c.g, (uint8_t) c.b); };

      it.fill(Color::BLACK);
      auto local_time = GetBestTime(id(sntp_time), id(ha_time));
      if (!local_time.is_valid()) {
        const bool warning_on = ((millis() / 1000U) % 2U) == 0U;

        if (warning_on) {
          const Color warning = to_color(ScaleColor(RED_HUE, 1));

          for (int x = 0; x < 32; x++) {
            it.draw_pixel_at(x, 0, warning);
            it.draw_pixel_at(x, 7, warning);
          }

          for (int y = 1; y < 7; y++) {
            it.draw_pixel_at(0, y, warning);
            it.draw_pixel_at(31, y, warning);
          }
        }
        return;
      }

      uint32_t now_ms = millis();
      uint32_t frame_dt = now_ms - id(last_frame_ms);
      id(last_frame_ms) = now_ms;
      if (!id(current_state).has_state()) return;

      int currentstate = (int) id(current_state).state;
      int day_b = SafePercent(id(day_brightness).state, 40);
      int night_b = SafePercent(id(night_brightness).state, 10);  

      uint32_t anim_elapsed = now_ms - id(anim_start_time);
      bool anim_active = id(anim_mode) != ANIM_NONE && anim_elapsed < TRANSITION_ANIM_DURATION_MS;
      if (!anim_active) id(anim_mode) = ANIM_NONE;
      float anim_p = anim_active ? SmoothStep((float) anim_elapsed / (float) TRANSITION_ANIM_DURATION_MS) : 0.0f;

      RGBColor anim_start = {(int) id(anim_start_r), (int) id(anim_start_g), (int) id(anim_start_b)};
      RGBColor anim_end = GetStateColor(id(anim_to_state), day_b, night_b);

      RGBColor target;
      bool track_exactly = false;
      if (id(test_active).state) {
        target = RGBColor{
          TestLevelToRaw((int) id(test_r).state),
          TestLevelToRaw((int) id(test_g).state),
          TestLevelToRaw((int) id(test_b).state)
        };
        track_exactly = true;
      } else if (anim_active) {
        target = LerpColor(anim_start, anim_end, anim_p);
        track_exactly = true;
      } else if (currentstate == AMBER && id(wind_down_active)) {
        target = LerpColor(
          GetStateColor(GREEN, day_b, night_b),
          GetStateColor(AMBER, day_b, night_b),
          id(wind_down_progress)
        );
      } else {
        target = GetStateColor(currentstate, day_b, night_b);
      }

      if (track_exactly || !id(display_initialized)) {
        id(current_r) = target.r;
        id(current_g) = target.g;
        id(current_b) = target.b;
        id(display_initialized) = true;
      } else {
        const float a = FadeAlpha(frame_dt);
        id(current_r) += (target.r - id(current_r)) * a;
        id(current_g) += (target.g - id(current_g)) * a;
        id(current_b) += (target.b - id(current_b)) * a;
      }

      // Rounded, so the fade actually lands on the target value.
      RGBColor draw = RoundColor(id(current_r), id(current_g), id(current_b));

      if (id(test_active).state) {
        it.fill(to_color(draw));
        return;
      }

      if (anim_active) {
        float y_start;
        float y_end;
        switch (id(anim_mode)) {
          case ANIM_SUNSET: y_start = 3.0f; y_end = 10.0f; break;
          case ANIM_SUNRISE: y_start = 10.0f; y_end = 3.0f; break;
          case ANIM_NAP_START: y_start = 3.0f; y_end = 7.0f; break;
          case ANIM_DAY_START: y_start = 3.0f; y_end = -4.0f; break;
          case ANIM_NAP_END:
          default: y_start = 7.0f; y_end = 3.0f; break;
        }

        int start_max = std::max({anim_start.r, anim_start.g, anim_start.b});
        int end_max = std::max({anim_end.r, anim_end.g, anim_end.b});
        RGBColor horizon = ScaleColor(HORIZON_HUE, Lerp(start_max, end_max, anim_p));
        it.line(0, 7, 31, 7, to_color(horizon));

        Color sun = to_color(draw);
        int cy = (int) roundf(y_start + anim_p * (y_end - y_start));
        const int shape[7][2] = {{14,16},{13,17},{12,18},{12,18},{12,18},{13,17},{14,16}};
        for (int dy = -3; dy <= 3; dy++) {
          int py = cy + dy;
          if (py >= 0 && py < 7) {
            for (int px = shape[dy + 3][0]; px <= shape[dy + 3][1]; px++) {
              it.draw_pixel_at(px, py, sun);
            }
          }
        }
        return;
      }

      const bool valid = id(schedule_valid);
      // Night and nap: small time + ZzZ and a dimmed progress bar.
      const bool night_view = valid && (currentstate == RED || currentstate == NAP);
      const RGBColor bar_rgb = night_view ? DimColor(draw, NIGHT_BAR_DIM) : draw;
      const Color bar_color = to_color(bar_rgb);
      const int total_dots = 32;
      if (valid) {
        float progress = id(clock_progress);
        if (std::isnan(progress)) progress = 0.0f;
        progress = std::max(0.0f, std::min(100.0f, progress));
        float exact_lit = total_dots * (1.0f - progress / 100.0f);
        int full_lit = std::max(0, std::min(total_dots, (int) exact_lit));
        float frac = exact_lit - full_lit;
        if (full_lit > 0) it.line(0, 0, full_lit - 1, 0, bar_color);
        if (full_lit < total_dots && frac > 0.0f) {
          it.draw_pixel_at(full_lit, 0, to_color(DimColor(bar_rgb, frac)));
        }
      } else {
        // Invalid schedule: dashed bar, so it's obvious something needs fixing.
        for (int x = 0; x < total_dots; x += 2) it.draw_pixel_at(x, 0, to_color(draw));
      }

      if (night_view) {
        const Color icon_color = to_color(draw);
        auto draw_icon = [&](const Icon &icon, int x0) {
          for (int y = 0; y < icon.height; y++)
            for (int x = 0; x < icon.width; x++)
              if (icon.rows[y][x] == '#') it.draw_pixel_at(x0 + x, 1 + y, icon_color);
        };
        draw_icon(SLEEP_ICON, SLEEP_X);
        DrawSmallTime(local_time.hour, local_time.minute, SLEEP_TIME_X, SLEEP_TIME_Y,
                      [&](int x, int y) { it.draw_pixel_at(x, y, icon_color); });
        return;
      }

      RGBColor colon = draw;
      float remaining_min = id(window_remaining_minutes);
      if (valid && currentstate == AMBER) {
        // On/off blink: slow in the last 10 minutes, fast in the last 5.
        uint32_t period = 0;
        if (remaining_min <= PULSE_URGENT_THRESHOLD_MIN) period = PULSE_PERIOD_FAST_MS;
        else if (remaining_min <= PULSE_WARN_THRESHOLD_MIN) period = PULSE_PERIOD_SLOW_MS;
        if (period > 0 && !BlinkOn(now_ms, period)) colon = RGBColor{0, 0, 0};
      }

      char time_numbers[8];
      snprintf(time_numbers, sizeof(time_numbers), "%02u %02u", (unsigned) local_time.hour, (unsigned) local_time.minute);
      it.print(1, 1, id(tinyfont), to_color(draw), TextAlign::TOP_LEFT, time_numbers);
      it.print(1, 1, id(tinyfont), to_color(colon), TextAlign::TOP_LEFT, "  :  ");
